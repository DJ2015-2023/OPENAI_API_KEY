    <script>
      const W = [0.3, 0.733, 1.1, 1.5, 2.633, 3.033, 3.533, 4.133, 4.467, 4.733, 5.367, 5.867];
      const tl = gsap.timeline({ paused: true });
      // neon sign flickers on with "Темпл Бар"
      tl.fromTo('#sign', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out' }, 0.05);
      tl.fromTo('#neon', { opacity: 0.15 }, { opacity: 1, duration: 0.05 }, W[0]);
      tl.to('#neon', { opacity: 0.2, duration: 0.05, yoyo: true, repeat: 5 }, W[0] + 0.08);
      // map draws itself
      tl.fromTo('#map', { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.15);
      document.querySelectorAll('#streets path').forEach((p, i) => {
        const L = p.getTotalLength();
        p.style.strokeDasharray = L;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.out' }, 0.25 + i * 0.05);
      });
      tl.fromTo('#blocks rect', { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.02 }, 0.5);
      // pin drops on the bar
      tl.fromTo('#pin', { y: -600, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'bounce.out' }, W[0] + 0.15);
      tl.fromTo('#ring', { scale: 0.2, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.9, ease: 'power2.out' }, W[0] + 0.7);
      tl.fromTo('#ring', { scale: 0.2, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, W[0] + 1.6);
      // metro badge + route to the bar
      tl.fromTo('#metro', { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: 'back.out(2.5)' }, W[2] - 0.05);
      tl.fromTo('#mlabel', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, W[3] - 0.05);
      const route = document.getElementById('route');
      const RL = route.getTotalLength();
      tl.fromTo('#route', { opacity: 0 }, { opacity: 1, duration: 0.3 }, W[3] + 0.2);
      tl.fromTo('#route', { strokeDashoffset: RL }, { strokeDashoffset: 0, duration: 9.133 - W[3], ease: 'none', immediateRender: false }, W[3] + 0.2);
      // address
      tl.fromTo('#a1', { opacity: 0, y: 40, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.45, ease: 'power3.out' }, W[4] - 0.1);
      tl.fromTo('#c1', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2.5)' }, W[7] - 0.05);
      tl.fromTo('#c2', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2.5)' }, W[9] - 0.05);
      // slow push-in on the map for the whole shot
      tl.fromTo('#map svg.base', { scale: 1 }, { scale: 1.12, duration: 9.133, ease: 'none', transformOrigin: '600px 300px' }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
