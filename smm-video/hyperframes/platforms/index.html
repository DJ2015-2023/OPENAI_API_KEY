<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      /* Word timings come from ./timing.json (written by scripts/build_audio.py). */
      @font-face { font-family: 'Montserrat'; font-weight: 900; font-style: italic; font-display: block; src: url(./assets/fonts/montserrat-latin-900-italic.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Montserrat'; font-weight: 900; font-style: italic; font-display: block; src: url(./assets/fonts/montserrat-cyrillic-900-italic.woff2) format('woff2'); unicode-range: U+0400-045F; }
      @font-face { font-family: 'Montserrat'; font-weight: 800; font-display: block; src: url(./assets/fonts/montserrat-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Montserrat'; font-weight: 800; font-display: block; src: url(./assets/fonts/montserrat-cyrillic-800-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }
      :root { --pink: #ff2e93; --violet: #6a2cff; --yellow: #ffd84d; --orange: #ff8a00; --cyan: #21e6ff; --base: #1b0b3f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--base); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #bg { background: linear-gradient(160deg, var(--pink), var(--violet)); }
      .ring { position: absolute; left: 540px; top: 1050px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.25); transform: translate(-50%, -50%); }
      #bars { position: absolute; top: 44px; left: 36px; right: 36px; display: flex; gap: 10px; }
      #bars .b { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.3); overflow: hidden; }
      #bars .b i { display: block; height: 100%; width: 0; background: #fff; }
      #title { position: absolute; top: 170px; left: 0; right: 0; text-align: center; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 120px; color: #fff; text-transform: uppercase; text-shadow: 0 10px 30px rgba(20,0,60,0.4); }
      #grid { position: absolute; top: 470px; left: 90px; right: 90px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px 40px; }
      .app { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .icon { position: relative; width: 250px; height: 250px; border-radius: 62px; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px rgba(20,0,60,0.45), inset 0 3px 0 rgba(255,255,255,0.35); }
      .badge { position: absolute; top: -16px; right: -16px; min-width: 64px; height: 64px; border-radius: 32px; background: #ff3040; border: 5px solid #fff; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 32px; display: flex; align-items: center; justify-content: center; }
      .name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 40px; color: #fff; }
      #more { position: absolute; left: 0; right: 0; top: 1490px; text-align: center; }
      #more span { display: inline-block; padding: 26px 46px; border-radius: 999px; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.5); font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 50px; color: #fff; }
      #iris { position: absolute; left: 540px; top: 960px; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; border-radius: 50%; background: var(--yellow); transform: scale(0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.233" data-width="1080" data-height="1920">
      <div id="scene" class="clip layer" data-start="0" data-duration="7.233" data-track-index="0">
        <div id="bg" class="layer"></div>
        <div class="ring" style="width: 700px; height: 700px"></div>
        <div class="ring" style="width: 1100px; height: 1100px"></div>
        <div class="ring" style="width: 1500px; height: 1500px"></div>
        <div id="bars"><div class="b"><i style="width:100%"></i></div><div class="b"><i style="width:100%"></i></div><div class="b"><i style="width:100%"></i></div><div class="b"><i id="prog"></i></div><div class="b"><i></i></div><div class="b"><i></i></div></div>
        <div id="title">Работаю с</div>
        <div id="grid">
          <div class="app" id="a0">
            <div class="icon" style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%)">
              <svg width="150" height="150" viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="14" fill="none" stroke="#fff" stroke-width="5" /><circle cx="32" cy="32" r="11" fill="none" stroke="#fff" stroke-width="5" /><circle cx="46" cy="18" r="3.4" fill="#fff" /></svg>
              <div class="badge">3</div>
            </div>
            <div class="name">Instagram</div>
          </div>
          <div class="app" id="a1">
            <div class="icon" style="background: #1877f2">
              <svg width="140" height="140" viewBox="0 0 64 64"><path d="M36 58V36h7.4l1.1-8.6H36v-5.5c0-2.5.7-4.2 4.3-4.2H45V10.1c-.8-.1-3.5-.3-6.6-.3-6.6 0-11.1 4-11.1 11.4v6.3h-7.4V36h7.4v22z" fill="#fff" /></svg>
              <div class="badge">5</div>
            </div>
            <div class="name">Facebook</div>
          </div>
          <div class="app" id="a2">
            <div class="icon" style="background: #111">
              <svg width="150" height="150" viewBox="0 0 64 64">
                <g transform="translate(-2,-2)"><path d="M41 10c1 5 4.5 8.6 9.5 9v7c-3.4 0-6.6-1-9.5-2.9V40a13 13 0 1 1-13-13c.7 0 1.4 0 2 .2v7.2a6 6 0 1 0 4 5.6V10z" fill="#25f4ee" /></g>
                <g transform="translate(2,2)"><path d="M41 10c1 5 4.5 8.6 9.5 9v7c-3.4 0-6.6-1-9.5-2.9V40a13 13 0 1 1-13-13c.7 0 1.4 0 2 .2v7.2a6 6 0 1 0 4 5.6V10z" fill="#fe2c55" /></g>
                <path d="M41 10c1 5 4.5 8.6 9.5 9v7c-3.4 0-6.6-1-9.5-2.9V40a13 13 0 1 1-13-13c.7 0 1.4 0 2 .2v7.2a6 6 0 1 0 4 5.6V10z" fill="#fff" />
              </svg>
              <div class="badge">9</div>
            </div>
            <div class="name">TikTok</div>
          </div>
          <div class="app" id="a3">
            <div class="icon" style="background: #2aabee">
              <svg width="140" height="140" viewBox="0 0 64 64" style="margin-left: -10px"><path d="M8 30.5 52 13.6c2-.8 3.8.5 3.2 3.6l-7.5 35.4c-.5 2.5-2 3.1-4.1 1.9L32.2 46l-5.5 5.3c-.6.6-1.1 1.1-2.3 1.1l.8-11.6 21.2-19.1c.9-.8-.2-1.3-1.4-.5L18.8 37.7 7.6 34.2c-2.4-.8-2.5-2.4.4-3.7z" fill="#fff" /></svg>
              <div class="badge">2</div>
            </div>
            <div class="name">Telegram</div>
          </div>
          <div class="app" id="a4">
            <div class="icon" style="background: #0077ff">
              <svg width="160" height="160" viewBox="0 0 64 64"><path d="M34.6 47C17.8 47 8.2 35.5 7.8 16.3h8.4c.3 14.1 6.5 20 11.4 21.3V16.3h7.9v12.1c4.9-.5 10-6 11.7-12.1h7.9c-1.3 7.5-6.8 13-10.7 15.3 3.9 1.8 10.2 6.6 12.6 15.4h-8.7c-1.9-5.9-6.5-10.4-12.8-11V47h-1z" fill="#fff" /></svg>
              <div class="badge">4</div>
            </div>
            <div class="name">VK</div>
          </div>
          <div class="app" id="a5">
            <div class="icon" style="background: linear-gradient(135deg, #4fc3ff 0%, #7b5cff 55%, #c44bff 100%)">
              <span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 74px; color: #fff">MAX</span>
              <div class="badge">1</div>
            </div>
            <div class="name">MAX</div>
          </div>
        </div>
        <div id="more"><span>+ другие платформы</span></div>
        <div id="iris"></div>
      </div>
    </div>
    <script>
      const DUR = 7.233;
      const WORD = { title: 0.355, ig: 0.995, fb: 1.795, tt: 2.595, tg: 3.395, vk: 4.435, max: 5.195, more: 5.875 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#prog', { width: '0%' }, { width: '100%', duration: DUR, ease: 'none' }, 0);
      tl.fromTo('.ring', { scale: 0.85, opacity: 0.4 }, { scale: 1.15, opacity: 1, duration: DUR, ease: 'sine.inOut', stagger: 0.3 }, 0);
      tl.from('#title', { y: -260, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, WORD.title - 0.15);

      const order = [WORD.ig, WORD.fb, WORD.tt, WORD.tg, WORD.vk, WORD.max];
      order.forEach((t, i) => {
        tl.from(`#a${i}`, { y: -700, scale: 0.4, rotation: i % 2 ? 18 : -18, opacity: 0, duration: 0.55, ease: 'bounce.out' }, t - 0.2);
        tl.from(`#a${i} .badge`, { scale: 0, duration: 0.3, ease: 'back.out(4)' }, t + 0.3);
      });
      tl.from('#more', { scale: 0.3, opacity: 0, duration: 0.45, ease: 'back.out(2.5)' }, WORD.more - 0.1);
      // all apps wiggle once the set is complete
      tl.fromTo('.icon', { rotation: 0 }, { rotation: 4, duration: 0.09, yoyo: true, repeat: 5, ease: 'sine.inOut', immediateRender: false }, WORD.more + 0.3);

      // yellow iris covers the frame exactly at the cut (Remotion opens from the same yellow)
      tl.fromTo('#iris', { scale: 0 }, { scale: 1, duration: 0.4, ease: 'power3.in' }, DUR - 0.45);

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
