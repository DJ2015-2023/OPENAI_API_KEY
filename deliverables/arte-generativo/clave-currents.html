            colorPalette: ['#6B0F2A', '#C8102E', '#F2A7B5', '#E8C27A']
        };
        let defaultParams = JSON.parse(JSON.stringify(params));
        let noiseFn, pairs, t0 = 0;
        const CW = 720, CH = 1280;

        function claveParams() {
            return {seed: params.seed, pairs: params.pairs, flowScale: params.flowScale, radius: params.radius * CW / 1080,
                    trail: params.trail, twist: params.twist, glow: params.glow, bpm: params.bpm, palette: params.colorPalette};
        }

        function setup() {
            let canvas = createCanvas(CW, CH);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            noiseFn = Clave.makeNoise(params.seed);
            pairs = Clave.buildPairs(claveParams(), CW, CH);
            t0 = millis();
        }

        function draw() {
            const ctx = drawingContext;
            const g = ctx.createRadialGradient(CW / 2, CH * 0.4, 0, CW / 2, CH * 0.4, CH * 0.75);
            g.addColorStop(0, '#3A0718');
            g.addColorStop(1, '#12030A');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, CW, CH);
            Clave.drawClave(ctx, (millis() - t0) / 1000 + 4, CW, CH, claveParams(), noiseFn, pairs, {});
        }

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            if (paramName === 'pairs') pairs = Clave.buildPairs(claveParams(), CW, CH);
        }

        function updateColor(colorId, value) {
            const idx = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            ['pairs','flowScale','radius','trail','twist','glow','bpm'].forEach(k => {
                document.getElementById(k).value = params[k];
                document.getElementById(k + '-value').textContent = params[k];
            });
            params.colorPalette.forEach((c, i) => {
                document.getElementById('color' + (i + 1)).value = c;
                document.getElementById('color' + (i + 1) + '-value').textContent = c;
            });
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
