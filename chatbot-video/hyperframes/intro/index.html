<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      /* Word timings come from ./timing.json (written by scripts/build_audio.py). */
      @font-face { font-family: 'Unbounded'; font-weight: 900; font-display: block; src: url(./assets/fonts/unbounded-latin-900-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Unbounded'; font-weight: 900; font-display: block; src: url(./assets/fonts/unbounded-cyrillic-900-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }
      @font-face { font-family: 'Manrope'; font-weight: 800; font-display: block; src: url(./assets/fonts/manrope-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Manrope'; font-weight: 800; font-display: block; src: url(./assets/fonts/manrope-cyrillic-800-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }
      :root {
        --cream: #f6f1e7;
        --ink: #121212;
        --orange: #ff5a1f;
        --cobalt: #2b3bff;
        --lime: #c8f53c;
        --pink: #ff9bd2;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #paper { background-color: var(--cream); background-image: radial-gradient(#00000014 3px, transparent 3.5px); background-size: 54px 54px; }
      #blob { position: absolute; left: 140px; top: 260px; width: 800px; height: 800px; border-radius: 50%; background: var(--orange); border: 6px solid var(--ink); box-shadow: 16px 16px 0 var(--ink); }
      #bot { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-size: 420px; line-height: 1; }
      #title { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; white-space: nowrap; }
      .ch { display: inline-block; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 168px; color: var(--ink); text-shadow: 8px 8px 0 var(--orange); }
      #sub { position: absolute; left: 60px; right: 60px; top: 1270px; text-align: center; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 60px; color: var(--ink); line-height: 1.25; }
      #sub .row { overflow: hidden; }
      #sub .in { display: inline-block; }
      .mark { position: relative; display: inline-block; z-index: 0; }
      .mark::before { content: ''; position: absolute; left: -10px; right: -10px; top: 18%; bottom: 6%; background: var(--lime); border-radius: 8px; z-index: -1; transform: scaleX(var(--m, 0)) skewX(-8deg); transform-origin: 0 50%; }
      #big { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 250px; line-height: 1; color: var(--cobalt); text-shadow: 10px 10px 0 var(--ink); white-space: nowrap; }
      #big span { display: inline-block; }
      #badge { position: absolute; right: 70px; top: 170px; width: 230px; height: 230px; border-radius: 50%; background: var(--lime); border: 6px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 54px; color: var(--ink); }
      .bar { position: absolute; top: -600px; width: 1010px; height: 3120px; border-left: 8px solid var(--ink); transform: translateX(-3200px) rotate(18deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.216" data-width="1080" data-height="1920">
      <div id="scene" class="clip layer" data-start="0" data-duration="4.216" data-track-index="0">
        <div id="paper" class="layer"></div>
        <div id="blob"></div>
        <div id="bot">🤖</div>
        <div id="badge">24/7</div>
        <div id="title"><span class="ch">Ч</span><span class="ch">А</span><span class="ch">Т</span><span class="ch">-</span><span class="ch">Б</span><span class="ch">О</span><span class="ch">Т</span></div>
        <div id="sub">
          <div class="row"><span class="in" id="l1">который работает</span></div>
          <div class="row"><span class="in" id="l2">на <span class="mark" id="mk">ваш бизнес</span></span></div>
        </div>
        <div id="big"><span id="b24">24</span><span id="bsl">/</span><span id="b7">7</span></div>
        <div class="bar" id="bar0" style="left: -960px; background: #ff5a1f"></div>
        <div class="bar" id="bar1" style="left: 40px; background: #2b3bff"></div>
        <div class="bar" id="bar2" style="left: 1040px; background: #c8f53c"></div>
      </div>
    </div>
    <script>
      const DUR = 4.216;
      const W = { chat: 0.7, kotoryi: 1.22, vash: 2.1, biz: 2.34, d24: 2.74, four: 3.1, seven: 3.7 };
      const tl = gsap.timeline({ paused: true });

      // sticker blob + robot + badge
      tl.fromTo('#blob', { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.6, ease: 'back.out(1.8)' }, 0.05);
      tl.fromTo('#bot', { y: -900, rotation: -25 }, { y: 0, rotation: 0, duration: 0.7, ease: 'bounce.out' }, 0.15);
      tl.fromTo('#badge', { scale: 0 }, { scale: 1, duration: 0.45, ease: 'back.out(3)' }, 0.45);
      tl.fromTo('#badge', { rotation: 0 }, { rotation: 360, duration: DUR, ease: 'none', immediateRender: false }, 0.45);
      tl.fromTo('#bot', { scale: 1 }, { scale: 1.06, duration: 0.18, yoyo: true, repeat: 7, ease: 'sine.inOut', immediateRender: false }, 0.9);

      // ЧАТ-БОТ letters drop in
      tl.from('.ch', { y: -320, opacity: 0, rotation: (i) => [-24, 18, -12, 26, -20, 14, -28][i % 7], duration: 0.5, ease: 'back.out(2.2)', stagger: 0.05 }, W.chat - 0.05);

      // subline slots
      tl.from('#l1', { yPercent: 110, duration: 0.35, ease: 'power3.out' }, W.kotoryi - 0.05);
      tl.from('#l2', { yPercent: 110, duration: 0.35, ease: 'power3.out' }, W.vash - 0.12);
      tl.fromTo('#mk', { '--m': 0 }, { '--m': 1, duration: 0.3, ease: 'power2.out' }, W.biz);

      // 24/7 slams
      tl.from('#b24', { scale: 3, opacity: 0, duration: 0.3, ease: 'power4.out' }, W.d24 - 0.05);
      tl.from('#bsl', { scale: 3, opacity: 0, duration: 0.25, ease: 'power4.out' }, W.four);
      tl.from('#b7', { scale: 3, opacity: 0, rotation: 30, duration: 0.3, ease: 'power4.out' }, W.seven - 0.08);
      tl.fromTo('#scene', { scale: 1 }, { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.out' }, W.d24);
      tl.fromTo('#scene', { scale: 1 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, W.seven);

      // closing stripes: same geometry/easing as the Remotion opener, so the cut is seamless
      const quadInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
      const barX = (f, i) => {
        const d = (i - 1) * 2;
        const a = -9 + d, b = d;
        if (f <= a) return -3200;
        if (f >= b) return 0;
        return -3200 + 3200 * quadInOut((f - a) / (b - a));
      };
      const proxy = { f: -14 };
      tl.fromTo(proxy, { f: -14 }, {
        f: 0, duration: 14 / 30, ease: 'none',
        onUpdate: () => {
          for (let i = 0; i < 3; i++) {
            document.getElementById('bar' + i).style.transform = `translateX(${barX(proxy.f, i)}px) rotate(18deg)`;
          }
        },
      }, DUR - 14 / 30);

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
