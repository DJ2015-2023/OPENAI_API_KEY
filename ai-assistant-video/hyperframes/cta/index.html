<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      /* Timings come from ../timing.json (generated by scripts/build_audio.py):
         t1 = 0.8s "Хотите такого ИИ-ассистента…", t2 = 3.972s "Напишите мне в личные сообщения!" */
      :root {
        --ground: #04050d;
        --ink: #f4f7ff;
        --cyan: #27e8ff;
        --violet: #8d5cff;
        --magenta: #ff3d81;
        --gold: #ffc94a;
        --font-display: 'Inter Display', 'Inter', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .layer { position: absolute; inset: 0; }
      #bg { background: radial-gradient(120% 80% at 50% 40%, #0d1030 0%, #04050d 60%, #000 100%); }
      #glow { background: radial-gradient(55% 35% at 50% 62%, rgba(141, 92, 255, 0.55) 0%, transparent 70%); }
      #floor {
        position: absolute; left: -1080px; width: 3240px; top: 1250px; height: 2000px;
        transform-origin: 50% 0%; transform: perspective(700px) rotateX(72deg);
        background-image: linear-gradient(rgba(141, 92, 255, 0.7) 2px, transparent 2px), linear-gradient(90deg, rgba(141, 92, 255, 0.7) 2px, transparent 2px);
        background-size: 120px 120px;
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 65%);
        opacity: 0.45;
      }
      .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
      #q { position: absolute; top: 300px; left: 60px; right: 60px; text-align: center; }
      .w { display: inline-block; color: var(--ink); font-weight: 800; font-size: 76px; letter-spacing: -0.02em; line-height: 1.1; margin: 0 10px; }
      .w.hl {
        font-weight: 900; font-size: 104px; white-space: nowrap;
        background: linear-gradient(90deg, #fff, var(--cyan) 45%, var(--violet) 80%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 28px rgba(39, 232, 255, 0.55));
      }
      #cta { position: absolute; left: 90px; right: 90px; top: 1010px; text-align: center; }
      #btn {
        position: relative; display: flex; align-items: center; justify-content: center; gap: 28px;
        height: 220px; border-radius: 110px;
        background: linear-gradient(100deg, var(--magenta), var(--violet) 55%, var(--cyan));
        box-shadow: 0 0 80px rgba(255, 61, 129, 0.6), 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 4px 12px rgba(255, 255, 255, 0.4);
        overflow: hidden;
      }
      #btn .label { text-align: left; color: #fff; }
      #btn .l1 { font-size: 76px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
      #btn .l2 { font-size: 42px; font-weight: 600; opacity: 0.95; margin-top: 8px; }
      #shine { position: absolute; top: -40px; bottom: -40px; width: 160px; left: -300px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent); transform: skewX(-20deg); }
      #ring { position: absolute; left: 50%; top: 50%; width: 900px; height: 220px; margin: -110px 0 0 -450px; border-radius: 110px; border: 5px solid var(--cyan); opacity: 0; }
      #chat { width: 120px; height: 120px; flex-shrink: 0; }
      #rocket { position: absolute; left: 470px; top: 1960px; font-size: 150px; line-height: 1; filter: drop-shadow(0 0 30px rgba(255, 201, 74, 0.8)); }
      #trail { position: absolute; left: 520px; top: 1960px; width: 40px; height: 0px; border-radius: 20px; background: linear-gradient(to bottom, rgba(255, 201, 74, 0.95), rgba(255, 61, 129, 0.5), transparent); filter: blur(6px); }
      #arrow { position: absolute; left: 0; right: 0; top: 860px; text-align: center; color: var(--cyan); font-size: 90px; font-weight: 900; text-shadow: 0 0 30px var(--cyan); opacity: 0; }
      #tag { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; color: #cfd6ff; font-size: 40px; font-weight: 600; letter-spacing: 0.22em; opacity: 0; }
      #flash { background: #fff; opacity: 0; mix-blend-mode: screen; }
      #vignette { background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.75) 100%); }
      .bar { position: absolute; left: 0; right: 0; height: 26px; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.805" data-width="1080" data-height="1920">
      <div id="scene" class="clip layer" data-start="0" data-duration="7.805" data-track-index="0">
        <div id="bg" class="layer"></div>
        <div id="glow" class="layer"></div>
        <div id="floor"></div>
        <div id="sparks" class="layer"></div>

        <div id="q">
          <span class="w">Хотите</span><span class="w">такого</span><br />
          <span class="w hl">ИИ-АССИСТЕНТА</span><br />
          <span class="w">для</span><span class="w">своего</span><span class="w">бизнеса?</span>
        </div>

        <div id="arrow">↓</div>
        <div id="cta">
          <div id="ring"></div>
          <div id="btn">
            <svg id="chat" viewBox="0 0 64 64">
              <path d="M10 14a8 8 0 0 1 8-8h28a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H28L16 56V44h0a8 8 0 0 1-6-8z" fill="#fff" />
              <circle cx="22" cy="25" r="4" fill="#8d5cff" /><circle cx="32" cy="25" r="4" fill="#8d5cff" /><circle cx="42" cy="25" r="4" fill="#8d5cff" />
            </svg>
            <div class="label">
              <div class="l1">Напишите мне</div>
              <div class="l2">в личные сообщения</div>
            </div>
            <div id="shine"></div>
          </div>
        </div>
        <div id="tag">ИИ-АССИСТЕНТ ДЛЯ БИЗНЕСА · 24/7</div>

        <div id="trail"></div>
        <div id="rocket">🚀</div>

        <div id="flash" class="layer"></div>
        <div id="vignette" class="layer"></div>
        <div class="bar" style="top: 0"></div>
        <div class="bar" style="bottom: 0"></div>
      </div>
    </div>
    <script>
      const T1 = 0.8, T1D = 2.922, T2 = 3.972, T2D = 2.233, DUR = 7.805;

      // deterministic sparks
      const sparks = document.getElementById('sparks');
      const rnd = (s) => { const x = Math.sin(s * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
      for (let i = 0; i < 46; i++) {
        const d = document.createElement('div');
        d.className = 'spark';
        d.style.left = rnd(i * 3.3) * 1080 + 'px';
        d.style.top = (600 + rnd(i * 7.1) * 1300) + 'px';
        const s = 0.5 + rnd(i * 1.9) * 1.6;
        d.style.transform = `scale(${s})`;
        if (i % 4 === 0) { d.style.background = '#ff3d81'; d.style.boxShadow = '0 0 14px #ff3d81'; }
        sparks.appendChild(d);
      }

      const tl = gsap.timeline({ paused: true });

      // ambient: camera push + floor scroll + sparks drift
      tl.fromTo('#scene', { scale: 1.08, rotation: -1 }, { scale: 1.0, rotation: 0.6, duration: DUR, ease: 'none' }, 0);
      tl.fromTo('#floor', { backgroundPosition: '0px 0px' }, { backgroundPosition: '0px 1000px', duration: DUR, ease: 'none' }, 0);
      tl.to('.spark', { y: -700, opacity: 0, duration: DUR, ease: 'none', stagger: { each: 0.02, from: 'random' } }, 0);
      tl.fromTo('#glow', { opacity: 0.6 }, { opacity: 1, duration: 1.2, yoyo: true, repeat: 6, ease: 'sine.inOut' }, 0);

      // question words
      const words = gsap.utils.toArray('#q .w');
      tl.from(words, {
        opacity: 0, y: 80, rotationX: -80, scale: 0.6, filter: 'blur(16px)',
        duration: 0.55, ease: 'back.out(2)', stagger: T1D / (words.length + 1),
      }, T1);
      tl.to('#q .hl', { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' }, T1 + (T1D / (words.length + 1)) * 2 + 0.3);

      // question lifts, CTA slams in
      tl.to('#q', { y: -120, scale: 0.84, duration: 0.6, ease: 'power3.inOut' }, T2 - 0.35);
      tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.8, duration: 0.06, yoyo: true, repeat: 1 }, T2);
      tl.from('#btn', { scale: 2.6, opacity: 0, filter: 'blur(20px)', duration: 0.6, ease: 'expo.out' }, T2);
      tl.from('#chat', { rotation: -40, scale: 0, duration: 0.6, ease: 'back.out(3)' }, T2 + 0.2);
      tl.from('#btn .l2', { opacity: 0, x: 40, duration: 0.45, ease: 'power3.out' }, T2 + T2D * 0.35);
      tl.to('#arrow', { opacity: 1, duration: 0.3 }, T2 + 0.5);
      tl.to('#arrow', { y: 30, duration: 0.35, yoyo: true, repeat: 7, ease: 'sine.inOut' }, T2 + 0.5);
      tl.fromTo('#tag', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, T2 + 0.9);

      // pulses + shine
      for (let k = 0; k < 4; k++) {
        const at = T2 + 0.7 + k * 0.8;
        const ir = { immediateRender: false };
        tl.fromTo('#ring', { scale: 1, opacity: 0.9 }, { scale: 1.35, opacity: 0, duration: 0.7, ease: 'power2.out', ...ir }, at);
        tl.fromTo('#btn', { scale: 1 }, { scale: 1.05, duration: 0.17, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, at);
        tl.fromTo('#shine', { x: 0 }, { x: 1300, duration: 0.6, ease: 'power2.in', ...ir }, at + 0.1);
      }

      // rocket launch
      const R = T2 + T2D - 0.4;
      tl.fromTo('#rocket', { y: 0, x: 0, rotation: 0 }, { y: -2300, x: 120, rotation: -6, duration: 1.6, ease: 'power2.in' }, R);
      tl.fromTo('#trail', { y: 0, x: 0, height: 0 }, { y: -2240, x: 120, height: 900, duration: 1.6, ease: 'power2.in' }, R + 0.05);

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
