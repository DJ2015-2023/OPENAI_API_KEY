<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050307; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050307; }
      .layer { position: absolute; inset: 0; }
      #glow {
        background:
          radial-gradient(60% 38% at 50% 50%, rgba(120, 18, 38, 0.75), rgba(40, 6, 14, 0.4) 55%, transparent 80%),
          radial-gradient(120% 80% at 50% 50%, #12070c, #050307 70%);
      }
      .leak { position: absolute; border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; }
      #leak1 { width: 900px; height: 900px; left: -420px; top: 180px;
        background: radial-gradient(circle, rgba(255, 120, 60, 0.85), rgba(220, 40, 70, 0.35) 45%, transparent 70%); }
      #leak2 { width: 800px; height: 800px; right: -400px; top: 1000px;
        background: radial-gradient(circle, rgba(233, 194, 122, 0.8), rgba(200, 60, 40, 0.3) 50%, transparent 72%); }
      .bokeh { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
      #flare { position: absolute; left: -200px; top: 1040px; width: 1480px; height: 24px; filter: blur(6px);
        background: linear-gradient(90deg, transparent, rgba(255, 210, 160, 0.2) 30%, rgba(255, 245, 230, 0.95) 50%, rgba(255, 210, 160, 0.2) 70%, transparent);
        mix-blend-mode: screen; }
      #line { position: absolute; left: 140px; width: 800px; top: 1052px; height: 2px;
        background: linear-gradient(90deg, transparent, #e9c27a 20%, #fff2d6 50%, #e9c27a 80%, transparent); }
      #title { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
      .w1 { font-family: Montserrat; font-weight: 800; font-size: 170px; letter-spacing: 0.16em; color: #f5ebdd;
        padding-left: 0.16em; line-height: 1; }
      .w2 { font-family: 'Playfair Display'; font-style: italic; font-weight: 900; font-size: 250px; line-height: 1;
        margin-top: -10px; color: #e9c27a; filter: drop-shadow(0 0 40px rgba(233, 120, 70, 0.35)); }
      .w2 .ch { padding: 0 0.04em; background: linear-gradient(180deg, #fff1cf 0%, #e9c27a 45%, #a8702e 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .ch { display: inline-block; white-space: pre; }
      #sub { position: absolute; left: 0; right: 0; top: 1092px; text-align: center; font-family: Montserrat;
        font-weight: 500; font-size: 40px; letter-spacing: 0.42em; padding-left: 0.42em; color: #f5ebdd; }
      #heart { position: absolute; left: 490px; top: 1196px; width: 100px; height: 92px;
        filter: drop-shadow(0 0 28px rgba(224, 38, 63, 0.9)); }
      .corner { position: absolute; width: 90px; height: 90px; border-color: rgba(245, 235, 221, 0.55); border-style: solid; }
      #c1 { left: 70px; top: 150px; border-width: 3px 0 0 3px; }
      #c2 { right: 70px; top: 150px; border-width: 3px 3px 0 0; }
      #c3 { left: 70px; bottom: 150px; border-width: 0 0 3px 3px; }
      #c4 { right: 70px; bottom: 150px; border-width: 0 3px 3px 0; }
      #rec { position: absolute; left: 110px; top: 196px; font-family: Montserrat; font-weight: 600; font-size: 30px;
        letter-spacing: 0.2em; color: #f5ebdd; display: flex; align-items: center; gap: 16px; }
      #rec i { width: 22px; height: 22px; border-radius: 50%; background: #e0263f; box-shadow: 0 0 18px #e0263f; display: block; }
      #grain { opacity: 0.13; mix-blend-mode: overlay; background-size: 256px 256px; }
      #vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.85) 100%); }
      #flash { background: radial-gradient(circle at 50% 50%, #fff7ea, #ffd9a8 60%, #ff9c6a); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
      <div id="scene" class="clip layer" data-start="0" data-duration="3.6" data-track-index="0">
        <div id="glow" class="layer"></div>
        <div id="leak1" class="leak"></div>
        <div id="leak2" class="leak"></div>
        <div id="bokeh" class="layer"></div>
        <div id="flare"></div>
        <div id="title">
          <div class="w1" id="w1"></div>
          <div class="w2" id="w2"></div>
        </div>
        <div id="line"></div>
        <div id="sub"></div>
        <svg id="heart" viewBox="0 0 100 92">
          <path d="M50 90 C 20 66, 0 48, 0 26 C 0 10, 12 0, 27 0 C 38 0, 46 7, 50 15 C 54 7, 62 0, 73 0 C 88 0, 100 10, 100 26 C 100 48, 80 66, 50 90 Z" fill="#e0263f" />
        </svg>
        <div class="corner" id="c1"></div><div class="corner" id="c2"></div>
        <div class="corner" id="c3"></div><div class="corner" id="c4"></div>
        <div id="rec"><i></i>REC</div>
        <div id="grain" class="layer"></div>
        <div id="vignette" class="layer"></div>
        <div id="flash" class="layer"></div>
      </div>
    </div>
    <script>
      // Seeded PRNG keeps the composition deterministic across renders.
      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      const split = (el, text) => text.split("").forEach((c) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = c;
        el.appendChild(s);
      });
      split(document.getElementById("w1"), "VIDEO");
      split(document.getElementById("w2"), "Clip");
      split(document.getElementById("sub"), "ТВОЯ ИСТОРИЯ В КАДРЕ");

      const grain = document.createElement("canvas");
      grain.width = grain.height = 256;
      const g = grain.getContext("2d");
      const img = g.createImageData(256, 256);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = rand() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      document.getElementById("grain").style.backgroundImage = `url(${grain.toDataURL()})`;

      const bokeh = document.getElementById("bokeh");
      const dots = [];
      for (let i = 0; i < 26; i++) {
        const d = document.createElement("div");
        const size = 20 + rand() * 90;
        d.className = "bokeh";
        Object.assign(d.style, {
          width: `${size}px`, height: `${size}px`, left: `${rand() * 1080}px`, top: `${300 + rand() * 1400}px`,
          filter: `blur(${2 + rand() * 10}px)`, opacity: 0,
          background: rand() > 0.5 ? "radial-gradient(circle, rgba(255,214,150,0.9), rgba(255,214,150,0.1) 70%)"
                                   : "radial-gradient(circle, rgba(255,90,110,0.85), rgba(255,90,110,0.08) 70%)",
        });
        bokeh.appendChild(d);
        dots.push({ el: d, drift: 80 + rand() * 220, delay: rand() * 0.8, peak: 0.25 + rand() * 0.55 });
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#glow", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 2.4, ease: "power2.out" }, 0);
      tl.fromTo("#leak1", { x: -200, opacity: 0 }, { x: 520, opacity: 1, duration: 3.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#leak2", { x: 200, opacity: 0 }, { x: -480, opacity: 0.9, duration: 3.4, ease: "sine.inOut" }, 0.2);
      dots.forEach(({ el, drift, delay, peak }) => {
        tl.fromTo(el, { y: 0, opacity: 0 }, { y: -drift, opacity: peak, duration: 1.4, ease: "sine.out" }, delay);
        tl.to(el, { y: -drift * 2, opacity: peak * 0.6, duration: 1.6, ease: "none" }, delay + 1.4);
      });
      tl.fromTo(".corner", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out", stagger: 0.06 }, 0.1);
      tl.fromTo("#rec", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
      tl.to("#rec i", { opacity: 0.15, duration: 0.25, repeat: 5, yoyo: true, ease: "steps(1)" }, 0.5);

      tl.fromTo("#w1 .ch", { opacity: 0, y: 90, filter: "blur(24px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out", stagger: 0.07 }, 0.35);
      // Letter spread collapses inward (per-glyph x keeps it sub-pixel smooth).
      tl.fromTo("#w1 .ch", { x: (i) => (i - 2) * 70 }, { x: 0, duration: 1.6, ease: "expo.out" }, 0.35);
      tl.fromTo("#w2 .ch", { opacity: 0, scale: 1.8, rotate: -8, filter: "blur(30px)" },
        { opacity: 1, scale: 1, rotate: 0, filter: "blur(0px)", duration: 1, ease: "expo.out", stagger: 0.08 }, 0.8);
      tl.fromTo("#flare", { x: -900, opacity: 0 }, { x: 900, opacity: 1, duration: 1.1, ease: "power2.inOut" }, 0.9);
      tl.to("#flare", { opacity: 0, duration: 0.3 }, 2.0);
      tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.inOut" }, 1.2);
      tl.fromTo("#sub .ch", { opacity: 0, x: (i) => (i - 9.5) * 14, filter: "blur(10px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 1.2, ease: "expo.out", stagger: 0.02 }, 1.45);
      // Heartbeat: two quick pulses like a lub-dub.
      tl.fromTo("#heart", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)" }, 1.75);
      tl.to("#heart", { scale: 1.25, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 2.35);
      tl.to("#heart", { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 2.65);

      tl.to("#title", { scale: 1.06, duration: 3.6, ease: "none" }, 0);
      tl.to("#grain", { backgroundPosition: "512px 768px", duration: 3.6, ease: "steps(86)" }, 0);
      // Burn-out flash into the first Remotion scene.
      tl.to("#flash", { opacity: 1, duration: 0.42, ease: "power2.in" }, 3.18);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
