<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* --t is the scene clock (seconds) driven by the GSAP timeline; every
         ambient motion (cloth, water, particles) is a pure function of it. */
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        --t: 0;
        --ampL: 0;
        --ampR: 0;
        --wave: 1;
        --pop: 0;
      }
      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 100%;
        will-change: transform;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }
      img.layer {
        display: block;
      }

      /* River ripples: horizontal slices of the river shifted sideways. */
      #water {
        opacity: 1;
      }
      .wstrip {
        position: absolute;
        left: -12px;
        width: 1104px;
        background-image: url("assets/layers/water.png");
        background-size: 1080px 1920px;
        background-repeat: no-repeat;
        transform: translateX(calc(sin(var(--t) * 1.9rad + var(--j) * 0.85rad) * var(--wa) * var(--wave) * 1px));
      }
      #sunglint {
        left: 330px;
        top: 1700px;
        width: 440px;
        height: 230px;
        background: radial-gradient(ellipse at 50% 30%, rgba(255, 196, 92, 0.55), rgba(255, 150, 40, 0) 70%);
        mix-blend-mode: screen;
        opacity: calc(0.35 + 0.25 * sin(var(--t) * 2.3rad));
      }

      /* Flags: vertical slices of each flag group, waved by a travelling sine. */
      .flag {
        overflow: visible;
      }
      .fstrip {
        position: absolute;
        background-size: 1080px 1920px;
        background-repeat: no-repeat;
      }
      #flagL .fstrip {
        background-image: url("assets/layers/flag_left.png");
        transform: translateY(calc(sin(var(--t) * 2.5rad - var(--i) * 0.38rad) * var(--a) * var(--ampL) * 1px));
        filter: brightness(calc(1 + cos(var(--t) * 2.5rad - var(--i) * 0.38rad) * 0.07 * var(--ampL) * var(--a) / 7));
      }
      #flagR .fstrip {
        background-image: url("assets/layers/flag_right.png");
        transform: translateY(calc(sin(var(--t) * 2.3rad + var(--i) * 0.38rad + 1.3rad) * var(--a) * var(--ampR) * 1px));
        filter: brightness(calc(1 + cos(var(--t) * 2.3rad + var(--i) * 0.38rad + 1.3rad) * 0.07 * var(--ampR) * var(--a) / 7));
      }
      #flagL {
        transform-origin: 0% 45%;
        clip-path: inset(-40px 100% -40px -40px);
      }
      #flagR {
        transform-origin: 100% 45%;
        clip-path: inset(-40px -40px -40px 100%);
      }

      /* Mist + light */
      .haze {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        mix-blend-mode: screen;
      }
      #haze1 {
        left: -200px;
        top: 1380px;
        width: 900px;
        height: 380px;
        background: radial-gradient(closest-side, rgba(255, 186, 110, 0.45), rgba(255, 140, 60, 0));
        transform: translateX(calc(var(--t) * 14px));
      }
      #haze2 {
        left: 420px;
        top: 1500px;
        width: 860px;
        height: 320px;
        background: radial-gradient(closest-side, rgba(255, 214, 160, 0.35), rgba(255, 160, 80, 0));
        transform: translateX(calc(var(--t) * -11px));
      }
      #haze3 {
        left: 80px;
        top: 700px;
        width: 920px;
        height: 520px;
        background: radial-gradient(closest-side, rgba(255, 170, 80, 0.3), rgba(255, 120, 40, 0));
        transform: translateY(calc(sin(var(--t) * 0.5rad) * 18px));
      }

      #people {
        transform-origin: 50% 70%;
        filter: drop-shadow(0 0 var(--rim, 0px) rgba(255, 176, 70, 0.85)) brightness(var(--pb, 1));
      }

      /* Title reveals: soft wipe masks driven by --w, a gold sweep driven by --g. */
      .wipe {
        -webkit-mask-image: linear-gradient(var(--ang, 90deg), #000 0%, #000 calc(var(--w) - 9%), transparent var(--w));
        mask-image: linear-gradient(var(--ang, 90deg), #000 0%, #000 calc(var(--w) - 9%), transparent var(--w));
        --w: 0%;
      }
      #titleE {
        --ang: 98deg;
      }
      .glare {
        background: linear-gradient(
          105deg,
          rgba(255, 220, 140, 0) calc(var(--g) - 7%),
          rgba(255, 242, 196, 0.95) var(--g),
          rgba(255, 220, 140, 0) calc(var(--g) + 7%)
        );
        -webkit-mask-size: 1080px 1920px;
        mask-size: 1080px 1920px;
        mix-blend-mode: screen;
        --g: -20%;
      }
      #glareT {
        -webkit-mask-image: url("assets/layers/title_temperatura.png");
        mask-image: url("assets/layers/title_temperatura.png");
      }
      #glareE {
        -webkit-mask-image: url("assets/layers/title_europea.png");
        mask-image: url("assets/layers/title_europea.png");
      }
      #glareLogo {
        -webkit-mask-image: url("assets/layers/logo.png");
        mask-image: url("assets/layers/logo.png");
      }
      #titleWrap,
      #logo,
      #logoWrap {
        transform-origin: 50% 55%;
      }
      #logoWrap {
        transform-origin: 878px 194px;
      }

      .info {
        will-change: transform, opacity, filter;
      }

      .p {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 236, 180, 1) 0%, rgba(255, 190, 90, 0.6) 40%, rgba(255, 160, 60, 0) 72%);
        mix-blend-mode: screen;
        transform: translate(
          calc(sin(var(--t) * 0.7rad + var(--ph) * 1rad) * 14px),
          calc(var(--t) * var(--sp) * -1px)
        );
        opacity: calc(var(--pop) * (0.5 + 0.5 * sin(var(--t) * 2.8rad + var(--ph) * 1rad)));
      }

      #dark {
        background: #000;
      }
      #topShade {
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.75) 35%, rgba(0, 0, 0, 0) 68%);
      }
      #vignette {
        background: radial-gradient(ellipse 75% 60% at 50% 55%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="camera">
          <!-- 1. Moscow at sunset: clean plate (artists, flags and graphics removed) -->
          <img id="bg" class="layer" src="assets/layers/bg_plate.jpg" alt="" />
          <!-- Exact original poster, faded in underneath at the end so the closing frame is the poster itself -->
          <img id="poster" class="layer" src="assets/layers/poster_full.jpg" alt="" />
          <div id="water" class="layer" data-layout-allow-overflow></div>
          <div id="sunglint" class="layer"></div>
          <div id="hazeLow" class="layer" data-layout-allow-overflow>
            <div id="haze1" class="haze"></div>
            <div id="haze2" class="haze"></div>
          </div>

          <!-- 2. Flags -->
          <div id="flagL" class="layer flag" data-layout-allow-overflow></div>
          <div id="flagR" class="layer flag" data-layout-allow-overflow></div>
          <div id="hazeMid" class="layer" data-layout-allow-overflow><div id="haze3" class="haze"></div></div>

          <!-- 4. Artists (behind the title) -->
          <img id="people" class="layer" src="assets/layers/people.png" alt="" />

          <!-- 3. Title -->
          <div id="titleWrap" class="layer">
            <img id="titleShadow" class="layer" src="assets/layers/title_shadow.png" alt="" />
            <img id="titleT" class="layer wipe" src="assets/layers/title_temperatura.png" alt="TEMPERATURA" />
            <div id="glareT" class="layer glare"></div>
            <img id="titleE" class="layer wipe" src="assets/layers/title_europea.png" alt="EUROPEA" />
            <div id="glareE" class="layer glare"></div>
          </div>

          <!-- 5. Logo -->
          <div id="logoWrap" class="layer">
            <img id="logo" class="layer" src="assets/layers/logo.png" alt="Bachata Forever" />
            <div id="glareLogo" class="layer glare"></div>
          </div>

          <!-- 6. Event info -->
          <img id="info1" class="layer info" src="assets/layers/info1.png" alt="МОСКВА" />
          <img id="info2" class="layer info" src="assets/layers/info2.png" alt="26, 27 И 28 ФЕВРАЛЯ 2027 ГОДА" />
          <img id="info3" class="layer info" src="assets/layers/info3.png" alt="АРТИСТЫ" />
          <img id="info4" class="layer info" src="assets/layers/info4.png" alt="WILLY &amp; NORA" />

          <div id="particles" class="layer"></div>
        </div>
        <div id="topShade" class="layer"></div>
        <div id="vignette" class="layer"></div>
        <div id="dark" class="layer"></div>
      </div>

      <audio
        id="soundtrack"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        src="assets/audio/soundtrack.wav"
      ></audio>
    </div>

    <script>
      // ---- build sliced layers (deterministic DOM, no randomness) ----------
      const water = document.getElementById("water");
      const W_TOP = 1716, W_BOT = 1920, W_ROWS = 17;
      const rowH = (W_BOT - W_TOP) / W_ROWS;
      for (let j = 0; j < W_ROWS; j++) {
        const s = document.createElement("div");
        s.className = "wstrip";
        const y = W_TOP + j * rowH;
        s.style.top = y + "px";
        s.style.height = rowH + 1 + "px";
        s.style.backgroundPosition = `12px ${-y}px`;
        s.style.setProperty("--j", j);
        s.style.setProperty("--wa", (1.2 + 4.5 * (j / (W_ROWS - 1))).toFixed(2));
        water.appendChild(s);
      }

      function buildFlag(el, x0, x1, top, height, attachRight) {
        const STRIP = 20;
        const span = x1 - x0;
        for (let i = 0, x = x0; x < x1; i++, x += STRIP) {
          const s = document.createElement("div");
          s.className = "fstrip";
          s.style.left = x + "px";
          s.style.top = top + "px";
          s.style.width = STRIP + 1 + "px";
          s.style.height = height + "px";
          s.style.backgroundPosition = `${-x}px ${-top}px`;
          const d = attachRight ? (x1 - x) / span : (x - x0) / span;
          s.style.setProperty("--i", i);
          s.style.setProperty("--a", (7 * d).toFixed(2));
          el.appendChild(s);
        }
      }
      buildFlag(document.getElementById("flagL"), 0, 500, 80, 800, false);
      buildFlag(document.getElementById("flagR"), 660, 1080, 230, 700, true);

      // Seeded LCG for particle layout (identical every render).
      let seed = 20270226;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
      const pWrap = document.getElementById("particles");
      for (let k = 0; k < 34; k++) {
        const p = document.createElement("div");
        p.className = "p";
        const size = 4 + rnd() * 9;
        p.style.width = p.style.height = size.toFixed(1) + "px";
        p.style.left = (40 + rnd() * 1000).toFixed(0) + "px";
        p.style.top = (900 + rnd() * 1000).toFixed(0) + "px";
        p.style.setProperty("--sp", (10 + rnd() * 34).toFixed(1));
        p.style.setProperty("--ph", (rnd() * 6.28).toFixed(2));
        pWrap.appendChild(p);
      }

      // ---- timeline -------------------------------------------------------
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const stage = "#stage";

      // Scene clock for cloth / water / particles.
      tl.fromTo(stage, { "--t": 0 }, { "--t": 12, duration: 12, ease: "none" }, 0);

      // Camera: slow push on the skyline, pull back as the poster builds, settle at 9 s.
      tl.fromTo("#camera", { scale: 1.3, y: 0 }, { scale: 1.36, duration: 2, ease: "sine.inOut" }, 0)
        .to("#camera", { scale: 1.14, duration: 2.2, ease: "power2.inOut" }, 2)
        .to("#camera", { scale: 1.06, duration: 2, ease: "sine.inOut" }, 4.2)
        .to("#camera", { scale: 1.0, duration: 2.8, ease: "power2.inOut" }, 6.2);

      // 0–2 s: reveal from darkness, mist and a few particles.
      tl.fromTo("#dark", { opacity: 1 }, { opacity: 0, duration: 1.7, ease: "power2.out" }, 0)
        .fromTo("#topShade", { opacity: 1 }, { opacity: 0, duration: 2.6, ease: "sine.inOut" }, 1.6)
        .fromTo("#hazeLow", { opacity: 0 }, { opacity: 0.9, duration: 1.6, ease: "sine.out" }, 0.2)
        .to("#hazeLow", { opacity: 0.25, duration: 2, ease: "sine.inOut" }, 7)
        .fromTo(stage, { "--pop": 0 }, { "--pop": 0.8, duration: 1.5, ease: "sine.out" }, 0.4)
        .to(stage, { "--pop": 0.45, duration: 1.5, ease: "sine.inOut" }, 8.5)
        .fromTo("#hazeMid", { opacity: 0.8 }, { opacity: 0, duration: 2.5, ease: "sine.inOut" }, 3.5)
        .fromTo("#water", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0)
        .fromTo("#vignette", { opacity: 1 }, { opacity: 0.35, duration: 3, ease: "sine.inOut" }, 8.6);

      // 2–4 s: flags unfurl on a light breeze (left group, then right).
      tl.to("#flagL", { clipPath: "inset(-40px 0% -40px -40px)", duration: 1.6, ease: "power2.out" }, 2.0)
        .fromTo("#flagL", { x: -70, rotation: -5 }, { x: 0, rotation: 0, duration: 1.9, ease: "power3.out" }, 2.0)
        .to("#flagR", { clipPath: "inset(-40px -40px -40px 0%)", duration: 1.6, ease: "power2.out" }, 2.25)
        .fromTo("#flagR", { x: 70, rotation: 5 }, { x: 0, rotation: 0, duration: 1.9, ease: "power3.out" }, 2.25)
        .fromTo(stage, { "--ampL": 0 }, { "--ampL": 1.9, duration: 0.6, ease: "sine.out" }, 2.0)
        .to(stage, { "--ampL": 1, duration: 2.4, ease: "sine.inOut" }, 2.6)
        .to(stage, { "--ampL": 0.55, duration: 1.5, ease: "sine.inOut" }, 8.5)
        .fromTo(stage, { "--ampR": 0 }, { "--ampR": 1.9, duration: 0.6, ease: "sine.out" }, 2.25)
        .to(stage, { "--ampR": 1, duration: 2.4, ease: "sine.inOut" }, 2.85)
        .to(stage, { "--ampR": 0.55, duration: 1.5, ease: "sine.inOut" }, 8.5)
        .to(stage, { "--wave": 0.7, duration: 1.5, ease: "sine.inOut" }, 8.8);

      // 4–6 s: TEMPERATURA on a gold light pass, EUROPEA along its strokes, edge flash.
      tl.fromTo("#titleShadow", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.out" }, 3.9)
        .fromTo("#titleT", { "--w": "0%", y: 34, opacity: 0.0 }, { "--w": "112%", y: 0, opacity: 1, duration: 0.95, ease: "power2.out" }, 4.0)
        .fromTo("#glareT", { "--g": "-12%", opacity: 1 }, { "--g": "112%", duration: 0.95, ease: "power2.out" }, 4.0)
        .to("#glareT", { opacity: 0, duration: 0.25 }, 4.95)
        .fromTo("#titleE", { "--w": "0%", x: -18, opacity: 0 }, { "--w": "112%", x: 0, opacity: 1, duration: 0.8, ease: "power2.inOut" }, 4.75)
        // edge flash over both words
        .fromTo(["#glareT", "#glareE"], { "--g": "-15%", opacity: 0 }, { "--g": "115%", opacity: 1, duration: 0.45, ease: "power1.inOut" }, 5.55)
        .to(["#glareT", "#glareE"], { opacity: 0, duration: 0.2, ease: "sine.out" }, 6.0)
        .fromTo("#titleWrap", { filter: "brightness(1)" }, { filter: "brightness(1.18)", duration: 0.2, ease: "sine.out" }, 5.6)
        .to("#titleWrap", { filter: "brightness(1)", duration: 0.35, ease: "sine.inOut" }, 5.8);

      // 6–7 s: artists fade in behind the title with a warm rim light.
      tl.fromTo("#people", { opacity: 0, scale: 1.025, "--pb": 0.8, "--rim": "0px" }, { opacity: 1, "--pb": 1, "--rim": "22px", duration: 1.0, ease: "sine.inOut" }, 6.0)
        .to("#people", { scale: 1, duration: 3, ease: "sine.out" }, 6.0)
        .to("#people", { "--rim": "0px", duration: 1.6, ease: "sine.inOut" }, 7.2);

      // 7–8 s: logo with a glint across the gold ornament.
      tl.fromTo("#logoWrap", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 7.0)
        .fromTo("#glareLogo", { "--g": "70%", opacity: 1 }, { "--g": "102%", duration: 0.65, ease: "sine.inOut" }, 7.3)
        .to("#glareLogo", { opacity: 0, duration: 0.15 }, 7.85);

      // 8–9 s: event info, one line after another.
      ["#info1", "#info2", "#info3", "#info4"].forEach((sel, k) => {
        tl.fromTo(sel, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power2.out" }, 8.0 + k * 0.22);
      });

      // 9–12 s: the exact poster settles in underneath; camera already still.
      tl.fromTo("#poster", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 8.9);

      tl.set({}, {}, 12);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
